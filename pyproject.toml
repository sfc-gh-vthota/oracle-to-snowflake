[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ora2sf"
version = "0.1.0"
description = "Oracle to Snowflake ingestion utility — full load + incremental CDC"
requires-python = ">=3.9"
dependencies = [
    "oracledb>=2.0",
    "snowflake-connector-python>=3.6",
    "pyarrow>=14.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-mock"]

[project.scripts]
ora2sf = "ora2sf.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
