# Oracle to Snowflake type mapping
# Format: ORACLE_TYPE: SNOWFLAKE_TYPE

mappings:
  # Numeric
  NUMBER: NUMBER
  FLOAT: FLOAT
  BINARY_FLOAT: FLOAT
  BINARY_DOUBLE: DOUBLE
  INTEGER: NUMBER(38,0)

  # String
  VARCHAR2: VARCHAR
  NVARCHAR2: VARCHAR
  CHAR: CHAR
  NCHAR: CHAR
  CLOB: VARCHAR(16777216)
  NCLOB: VARCHAR(16777216)
  LONG: VARCHAR(16777216)

  # Date/Time
  DATE: TIMESTAMP_NTZ
  TIMESTAMP: TIMESTAMP_NTZ
  "TIMESTAMP WITH TIME ZONE": TIMESTAMP_TZ
  "TIMESTAMP WITH LOCAL TIME ZONE": TIMESTAMP_LTZ

  # Binary
  BLOB: BINARY
  RAW: BINARY
  "LONG RAW": BINARY

  # Other
  ROWID: VARCHAR(18)
  UROWID: VARCHAR(4000)
  XMLTYPE: VARIANT
  JSON: VARIANT
  BOOLEAN: BOOLEAN
